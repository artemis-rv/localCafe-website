<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Register</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="common.css">
</head>
<body>
  <header class="navigation">
    <h1 align="center">B&B</h1>
    <h2 align="center">Brew & Beyond</h2>
  </header>

  <div id="AdminRegister" class="table_book" style="width: 40%;">
    <h2>Admin Register</h2>
    <form id="adminRegisterForm" action="admin_register.php" method="post">
      <section>
        <label>Username</label><br>
        <input name="username" type="text" placeholder="Admin username" required>
      </section>
      <section>
        <label>Email</label><br>
        <input name="email" type="email" placeholder="Email" required>
      </section>
      <section>
        <label>Phone</label><br>
        <input name="phone" type="text" placeholder="Phone" required>
      </section>
      <section>
        <label>Password</label><br>
        <input name="password" type="password" placeholder="Password" required>
      </section>
      <section>
        <label>Confirm Password</label><br>
        <input name="confirm_password" type="password" placeholder="Confirm Password" required>
      </section>
      <section>
        <button type="submit">Register</button>
      </section>
    </form>
    <p>Already an admin? <a href="admin_login.html">Login here</a></p>
  </div>

  <script src="backToTop.js"></script>
</body>
</html>
